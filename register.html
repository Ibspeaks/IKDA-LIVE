<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IKDA LIVE - Create Account</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #063b2b, #0b5d43);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: white;
    }

    .box {
      width: 100%;
      max-width: 430px;
      background: #ffffff;
      color: #222;
      border-radius: 18px;
      padding: 30px 24px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.25);
    }

    .logo {
      text-align: center;
      margin-bottom: 10px;
    }

    .logo h1 {
      color: #087443;
      font-size: 32px;
      font-weight: 800;
    }

    .logo p {
      color: #b58a18;
      font-weight: bold;
      margin-top: 5px;
    }

    h2 {
      text-align: center;
      margin: 20px 0;
      color: #063b2b;
    }

    label {
      display: block;
      margin: 14px 0 6px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #087443;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 22px;
      border: none;
      border-radius: 10px;
      background: #087443;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #888;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 13px;
      border-radius: 9px;
      text-align: center;
      line-height: 1.5;
      font-size: 14px;
    }

    .success {
      display: block;
      background: #e7f7ed;
      color: #146c36;
    }

    .error {
      display: block;
      background: #ffe9e9;
      color: #b00020;
    }

    .login {
      text-align: center;
      margin-top: 20px;
    }

    .login a {
      color: #087443;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="logo">
      <h1>IKDA LIVE</h1>
      <p>Igala Kingdom Descendant Association</p>
    </div>

    <h2>Create Account</h2>

    <form id="registerForm">

      <label for="name">Full Name</label>
      <input
        type="text"
        id="name"
        placeholder="Enter your full name"
        required
      >

      <label for="email">Email Address</label>
      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Create a password"
        minlength="6"
        required
      >

      <label for="confirmPassword">Confirm Password</label>
      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm your password"
        minlength="6"
        required
      >

      <button type="submit" id="registerButton">
        Create Account
      </button>

    </form>

    <div id="message" class="message"></div>

    <div class="login">
      Already have an account?
      <a href="login.html">Login</a>
    </div>

  </div>

  <script>

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const form = document.getElementById("registerForm");
    const button = document.getElementById("registerButton");
    const message = document.getElementById("message");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message " + type;
    }

    form.addEventListener("submit", async function(event) {

      event.preventDefault();

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword =
        document.getElementById("confirmPassword").value;

      message.className = "message";
      message.textContent = "";

      if (!name || !email || !password || !confirmPassword) {
        showMessage("Please fill in all the fields.", "error");
        return;
      }

      if (password.length < 6) {
        showMessage(
          "Password must be at least 6 characters.",
          "error"
        );
        return;
      }

      if (password !== confirmPassword) {
        showMessage(
          "Passwords do not match.",
          "error"
        );
        return;
      }

      button.disabled = true;
      button.textContent = "Creating Account...";

      try {

        const { data, error } =
          await supabaseClient.auth.signUp({
            email: email,
            password: password,
            options: {
              data: {
                full_name: name
              }
            }
          });

        console.log("Supabase response:", data);
        console.log("Supabase error:", error);

        if (error) {
          showMessage(
            "Registration failed: " + error.message,
            "error"
          );

          button.disabled = false;
          button.textContent = "Create Account";
          return;
        }

        if (data.session) {

          showMessage(
            "Account created successfully! Opening your dashboard...",
            "success"
          );

          setTimeout(function() {
            window.location.href = "dashboard.html";
          }, 1200);

        } else {

          showMessage(
            "Account created successfully! Please check your email and verify your account before logging in.",
            "success"
          );

          button.disabled = false;
          button.textContent = "Create Account";
        }

      } catch (err) {

        console.error(err);

        showMessage(
          "Something went wrong: " + err.message,
          "error"
        );

        button.disabled = false;
        button.textContent = "Create Account";
      }

    });

  </script>

</body>
</html>
