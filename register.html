<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IKDA Live - Create Account</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #071f16;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 430px;
      background: #0d3325;
      border: 1px solid #d4af37;
      border-radius: 20px;
      padding: 30px 25px;
    }

    .logo {
      text-align: center;
      color: #d4af37;
      font-size: 28px;
      font-weight: bold;
    }

    .subtitle {
      text-align: center;
      color: #b9c9c1;
      font-size: 13px;
      margin: 8px 0 25px;
    }

    h2 {
      text-align: center;
      color: #d4af37;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 16px;
      border-radius: 10px;
      border: 1px solid #557568;
      background: #071f16;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: #d4af37;
      color: #071f16;
      font-size: 16px;
      font-weight: bold;
    }

    button:disabled {
      opacity: .6;
    }

    #message {
      text-align: center;
      margin-top: 18px;
      line-height: 1.5;
    }

    .login {
      text-align: center;
      margin-top: 22px;
      color: #b9c9c1;
    }

    a {
      color: #d4af37;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="box">

  <div class="logo">IKDA LIVE</div>

  <div class="subtitle">
    IGALA KINGDOM DESCENDANT ASSOCIATION
  </div>

  <h2>Create Account</h2>

  <form id="registerForm">

    <label>Full Name</label>

    <input
      id="name"
      type="text"
      placeholder="Enter your full name"
      required
    >

    <label>Email Address</label>

    <input
      id="email"
      type="email"
      placeholder="Enter your email"
      required
    >

    <label>Password</label>

    <input
      id="password"
      type="password"
      placeholder="Minimum 6 characters"
      minlength="6"
      required
    >

    <label>Confirm Password</label>

    <input
      id="confirmPassword"
      type="password"
      placeholder="Confirm password"
      minlength="6"
      required
    >

    <button id="registerButton" type="submit">
      CREATE ACCOUNT
    </button>

  </form>

  <div id="message"></div>

  <div class="login">
    Already have an account?
    <a href="login.html">Login</a>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script>

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const form =
  document.getElementById("registerForm");

const button =
  document.getElementById("registerButton");

const message =
  document.getElementById("message");


form.addEventListener("submit", async function(e) {

  e.preventDefault();

  const name =
    document.getElementById("name").value.trim();

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const confirmPassword =
    document.getElementById("confirmPassword").value;


  if (password !== confirmPassword) {

    message.style.color = "#ff8b8b";

    message.textContent =
      "Passwords do not match.";

    return;
  }


  button.disabled = true;

  button.textContent =
    "CREATING ACCOUNT...";

  message.textContent = "";


  try {

    const { data, error } =
      await supabaseClient.auth.signUp({

        email: email,

        password: password,

        options: {
          data: {
            full_name: name
          }
        }

      });


    if (error) {
      throw error;
    }


    /*
      If Supabase returns a session,
      the user is already logged in.
    */

    if (data.session) {

      message.style.color = "#7ff0a8";

      message.textContent =
        "Account created successfully. Opening your dashboard...";

      setTimeout(function() {

        window.location.href =
          "dashboard.html";

      }, 1000);

      return;
    }


    /*
      No session normally means
      email confirmation is required.
    */

    message.style.color = "#d4af37";

    message.textContent =
      "Account created successfully. Please check your email, verify your account, then login.";

    button.disabled = false;

    button.textContent =
      "ACCOUNT CREATED";


  } catch (error) {

    message.style.color = "#ff8b8b";

    message.textContent =
      error.message;

    button.disabled = false;

    button.textContent =
      "CREATE ACCOUNT";

  }

});

</script>

</body>
</html>
