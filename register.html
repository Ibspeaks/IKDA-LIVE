<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>IKDA Live Registration</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #071f16;
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 430px;
      background: #0d3325;
      border: 1px solid #c9a227;
      border-radius: 20px;
      padding: 30px 25px;
    }

    .logo {
      text-align: center;
      color: #d4af37;
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #b9c9c1;
      font-size: 13px;
      margin-bottom: 28px;
    }

    h2 {
      text-align: center;
      color: #d4af37;
      margin-bottom: 25px;
    }

    label {
      display: block;
      color: #dce7e1;
      font-size: 14px;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 17px;
      border-radius: 10px;
      border: 1px solid #557568;
      background: #071f16;
      color: white;
      font-size: 16px;
    }

    input:focus {
      outline: none;
      border-color: #d4af37;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #d4af37;
      color: #071f16;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    .message {
      text-align: center;
      margin-top: 15px;
      line-height: 1.5;
      font-size: 14px;
      min-height: 20px;
    }

    .login {
      text-align: center;
      margin-top: 25px;
      color: #b9c9c1;
      font-size: 14px;
    }

    .login a {
      color: #d4af37;
      text-decoration: none;
      font-weight: bold;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #9fb2a8;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="box">

  <div class="logo">
    IKDA LIVE
  </div>

  <div class="subtitle">
    IGALA KINGDOM DESCENDANT ASSOCIATION
  </div>

  <h2>
    Create Account
  </h2>

  <form id="registerForm">

    <label>
      Full Name
    </label>

    <input
      type="text"
      id="name"
      placeholder="Enter your full name"
      required
    >


    <label>
      Email Address
    </label>

    <input
      type="email"
      id="email"
      placeholder="Enter your email"
      required
    >


    <label>
      Password
    </label>

    <input
      type="password"
      id="password"
      placeholder="Create a password"
      minlength="6"
      required
    >


    <label>
      Confirm Password
    </label>

    <input
      type="password"
      id="confirmPassword"
      placeholder="Confirm your password"
      minlength="6"
      required
    >


    <button
      type="submit"
      id="registerButton"
    >
      CREATE ACCOUNT
    </button>

  </form>


  <div
    class="message"
    id="message"
  ></div>


  <div class="login">
    Already have an account?
    <a href="login.html">
      Login
    </a>
  </div>


  <a
    class="back"
    href="index.html"
  >
    ← Back to IKDA Live
  </a>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script>

  const { createClient } = supabase;

  const supabaseClient =
    createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  const form =
    document.getElementById(
      "registerForm"
    );

  const button =
    document.getElementById(
      "registerButton"
    );

  const message =
    document.getElementById(
      "message"
    );


  form.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      const name =
        document.getElementById(
          "name"
        ).value.trim();


      const email =
        document.getElementById(
          "email"
        ).value.trim();


      const password =
        document.getElementById(
          "password"
        ).value;


      const confirmPassword =
        document.getElementById(
          "confirmPassword"
        ).value;


      message.textContent = "";


      if (password !== confirmPassword) {

        message.textContent =
          "Passwords do not match.";

        return;

      }


      button.disabled = true;

      button.textContent =
        "CREATING ACCOUNT...";


      const {
        data,
        error
      } =
        await supabaseClient.auth.signUp({

          email: email,

          password: password,

          options: {

            data: {
              full_name: name
            }

          }

        });


      if (error) {

        message.textContent =
          error.message;

        button.disabled = false;

        button.textContent =
          "CREATE ACCOUNT";

        return;

      }


      message.style.color =
        "#d4af37";


      message.textContent =
        "Account created successfully. Check your email if verification is required, then login.";


      button.disabled = false;

      button.textContent =
        "ACCOUNT CREATED";

    }

  );

</script>

</body>
</html>
