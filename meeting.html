<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>IKDA Live Meeting</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #071f16;
      color: white;
      min-height: 100vh;
    }

    header {
      background: #0b2e21;
      border-bottom: 1px solid #c9a227;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      color: #d4af37;
      font-size: 20px;
      font-weight: bold;
    }

    .leave {
      background: #8b2020;
      color: white;
      border: none;
      padding: 9px 15px;
      border-radius: 20px;
      cursor: pointer;
    }

    .container {
      width: 92%;
      max-width: 600px;
      margin: 30px auto;
      text-align: center;
    }

    .live {
      color: #ff6b6b;
      font-weight: bold;
      margin-bottom: 10px;
    }

    h1 {
      color: #d4af37;
      margin-bottom: 10px;
    }

    .room-id {
      background: #0d3325;
      border: 1px solid #28533f;
      padding: 15px;
      border-radius: 12px;
      margin: 20px 0;
    }

    .room-id span {
      display: block;
      color: #9fb2a8;
      font-size: 13px;
      margin-bottom: 7px;
    }

    #meetingId {
      color: #d4af37;
      font-weight: bold;
      font-size: 20px;
      letter-spacing: 2px;
    }

    .mic-area {
      background: #0d3325;
      border-radius: 20px;
      padding: 35px 20px;
      margin-top: 20px;
      border: 1px solid #28533f;
    }

    .mic {
      width: 100px;
      height: 100px;
      margin: auto;
      border-radius: 50%;
      background: #d4af37;
      color: #071f16;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 45px;
    }

    .status {
      margin-top: 20px;
      color: #b9c9c1;
    }

    .participants {
      margin-top: 25px;
      text-align: left;
    }

    .participants h3 {
      color: #d4af37;
      margin-bottom: 10px;
    }

    .participant {
      background: #071f16;
      border: 1px solid #28533f;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 8px;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 25px;
    }

    .control {
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #d4af37;
      color: #071f16;
      font-weight: bold;
      cursor: pointer;
    }

    .control.secondary {
      background: #214b3a;
      color: white;
      border: 1px solid #557568;
    }

    .error {
      display: none;
      margin-top: 20px;
      color: #ff8b8b;
    }
  </style>
</head>

<body>

<header>
  <div class="brand">IKDA LIVE</div>

  <button class="leave" onclick="leaveMeeting()">
    LEAVE
  </button>
</header>

<div class="container">

  <div class="live">● LIVE AUDIO</div>

  <h1>IKDA Community Meeting</h1>

  <div class="room-id">
    <span>MEETING ID</span>
    <strong id="meetingId">Loading...</strong>
  </div>

  <div class="mic-area">

    <div class="mic" id="micIcon">
      🎙️
    </div>

    <div class="status" id="status">
      Connecting to audio...
    </div>

    <div class="error" id="error">
      Unable to access your microphone.
    </div>

  </div>

  <div class="participants">

    <h3>Participants</h3>

    <div class="participant">
      🎙️ You
    </div>

  </div>

  <div class="controls">

    <button class="control" onclick="toggleMicrophone()" id="micButton">
      MIC ON
    </button>

    <button class="control secondary" onclick="copyMeetingId()">
      COPY ID
    </button>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="meeting.js"></script>

<script>

  let microphoneOn = true;

  // Get meeting ID
  const params = new URLSearchParams(
    window.location.search
  );

  const roomId =
    params.get("room") || "IKDA-DEMO";

  document.getElementById("meetingId").textContent =
    roomId;


  // Check authentication
  async function checkMeetingLogin() {

    const {
      data: { session }
    } = await supabaseClient.auth.getSession();

    if (!session) {

      window.location.href = "login.html";

      return false;
    }

    return true;
  }


  // Toggle microphone
  function toggleMicrophone() {

    if (!localStream) {
      return;
    }

    const audioTracks =
      localStream.getAudioTracks();

    microphoneOn = !microphoneOn;

    audioTracks.forEach(function(track) {
      track.enabled = microphoneOn;
    });

    const button =
      document.getElementById("micButton");

    const icon =
      document.getElementById("micIcon");

    const status =
      document.getElementById("status");

    if (microphoneOn) {

      button.textContent = "MIC ON";
      icon.textContent = "🎙️";
      status.textContent = "Your microphone is on";

    } else {

      button.textContent = "MIC OFF";
      icon.textContent = "🔇";
      status.textContent = "Your microphone is muted";

    }
  }


  // Copy meeting ID
  async function copyMeetingId() {

    await navigator.clipboard.writeText(roomId);

    const button =
      document.querySelector(".secondary");

    const oldText =
      button.textContent;

    button.textContent = "COPIED!";

    setTimeout(function() {
      button.textContent = oldText;
    }, 1500);
  }


  // Leave meeting
  function leaveMeeting() {

    if (typeof leaveIKDAMeeting === "function") {
      leaveIKDAMeeting();
    }

    window.location.href =
      "dashboard.html";
  }


  // Start page
  async function startMeetingPage() {

    const loggedIn =
      await checkMeetingLogin();

    if (!loggedIn) return;

    if (typeof startIKDALive === "function") {

      try {

        await startIKDALive();

        document.getElementById("status").textContent =
          "Microphone connected. You are live.";

      } catch (error) {

        console.error(error);

        document.getElementById("status").textContent =
          "Microphone permission is required.";

        document.getElementById("error").style.display =
          "block";
      }

    }

  }

  startMeetingPage();

</script>

</body>
</html>
