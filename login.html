<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IKDA LIVE - Member Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #063b2b, #0b5d43);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 18px;
      padding: 30px 24px;
      box-shadow: 0 15px 40px rgba(0,0,0,.25);
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo h1 {
      margin: 0;
      color: #087443;
      font-size: 32px;
    }

    .logo p {
      color: #b58a18;
      font-weight: bold;
      font-size: 13px;
    }

    h2 {
      text-align: center;
      color: #063b2b;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin: 14px 0 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: #087443;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    button:disabled {
      opacity: .6;
    }

    #message {
      display: none;
      margin-top: 18px;
      padding: 14px;
      border-radius: 10px;
      text-align: center;
      line-height: 1.5;
    }

    .success {
      display: block !important;
      background: #e7f7ed;
      color: #146c36;
    }

    .error {
      display: block !important;
      background: #ffe9e9;
      color: #b00020;
    }

    .links {
      text-align: center;
      margin-top: 20px;
    }

    .links a {
      color: #087443;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>

<body>

<div class="box">

  <div class="logo">
    <h1>IKDA LIVE</h1>
    <p>Igala Kingdom Descendant Association</p>
  </div>

  <h2>Member Login</h2>

  <form id="loginForm">

    <label>Email Address</label>

    <input
      type="email"
      id="email"
      placeholder="Enter your email"
      required
    >

    <label>Password</label>

    <input
      type="password"
      id="password"
      placeholder="Enter your password"
      required
    >

    <button type="submit" id="loginButton">
      Login
    </button>

  </form>

  <div id="message"></div>

  <div class="links">
    Don't have an account?
    <a href="register.html">Create Account</a>
    <br><br>
    <a href="index.html">← Back to Home</a>
  </div>

</div>

<script>

const SUPABASE_URL =
"https://dvskuudjamineqbvvjld.supabase.co";

const SUPABASE_KEY =
"sb_publishable_r8v8E93qy_DpvNhL9pvyKQ_HZBLaBm5";

const supabaseClient =
supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const form =
document.getElementById("loginForm");

const button =
document.getElementById("loginButton");

const message =
document.getElementById("message");

function showMessage(text, type) {
  message.textContent = text;
  message.className = type;
}

form.addEventListener("submit", async function(e) {

  e.preventDefault();

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  if (!email || !password) {
    showMessage(
      "Please enter your email and password.",
      "error"
    );
    return;
  }

  button.disabled = true;
  button.textContent = "Logging in...";

  showMessage(
    "Connecting to IKDA LIVE...",
    "success"
  );

  try {

    const result =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (result.error) {

      showMessage(
        "Login failed: " + result.error.message,
        "error"
      );

      button.disabled = false;
      button.textContent = "Login";

      return;
    }

    if (result.data.session) {

      showMessage(
        "Login successful! Opening dashboard...",
        "success"
      );

      setTimeout(() => {
        window.location.href = "dashboard.html";
      }, 1000);

    } else {

      showMessage(
        "Login was completed but no session was returned.",
        "error"
      );

      button.disabled = false;
      button.textContent = "Login";
    }

  } catch (error) {

    showMessage(
      "Connection error: " + error.message,
      "error"
    );

    button.disabled = false;
    button.textContent = "Login";
  }

});

</script>

</body>
</html>
