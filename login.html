<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>IKDA Live Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #071f16;
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 420px;
      background: #0d3325;
      border: 1px solid #c9a227;
      border-radius: 20px;
      padding: 30px 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .logo {
      text-align: center;
      color: #d4af37;
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #b9c9c1;
      margin-bottom: 30px;
      font-size: 14px;
    }

    h2 {
      text-align: center;
      color: #d4af37;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #dce7e1;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 18px;
      border-radius: 10px;
      border: 1px solid #557568;
      background: #071f16;
      color: white;
      font-size: 16px;
    }

    input:focus {
      outline: none;
      border-color: #d4af37;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #d4af37;
      color: #071f16;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    .message {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      color: #ff9c9c;
      min-height: 20px;
    }

    .register {
      text-align: center;
      margin-top: 25px;
      color: #b9c9c1;
      font-size: 14px;
    }

    .register a {
      color: #d4af37;
      text-decoration: none;
      font-weight: bold;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #9fb2a8;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="box">

  <div class="logo">IKDA LIVE</div>

  <div class="subtitle">
    IGALA KINGDOM DESCENDANT ASSOCIATION
  </div>

  <h2>Member Login</h2>

  <form id="loginForm">

    <label>Email Address</label>

    <input
      type="email"
      id="email"
      placeholder="Enter your email"
      required
    >

    <label>Password</label>

    <input
      type="password"
      id="password"
      placeholder="Enter your password"
      required
    >

    <button type="submit" id="loginButton">
      LOGIN
    </button>

  </form>

  <div class="message" id="message"></div>

  <div class="register">
    Don't have an account?
    <a href="register.html">Create Account</a>
  </div>

  <a class="back" href="index.html">
    ← Back to IKDA Live
  </a>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script>

  const { createClient } = supabase;

  const supabaseClient = createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const form = document.getElementById("loginForm");
  const button = document.getElementById("loginButton");
  const message = document.getElementById("message");

  form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    message.textContent = "";
    button.disabled = true;
    button.textContent = "LOGGING IN...";

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (error) {

      message.textContent =
        error.message;

      button.disabled = false;
      button.textContent = "LOGIN";

      return;
    }

    // Login successful
    window.location.href = "dashboard.html";

  });

</script>

</body>
</html>
